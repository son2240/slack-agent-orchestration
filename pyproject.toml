[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentorch"
version = "0.1.0"
description = "Coordinate AI coding agents through Slack with loop prevention and a shared task ledger"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
agentorch = "agentorch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
